{# Una opción del menú (columna lateral y hoja «Más»). Espera `opcion`, resuelta por coreapp/navegacion.py. #}
<a class="menu-enlace{% if opcion.corta %} tiene-corta{% endif %}" href="{{ opcion.url }}"{% if opcion.activa %} aria-current="page"{% endif %}{% if opcion.otra_pestana %} target="_blank" rel="noopener"{% endif %}><svg class="icono" aria-hidden="true" focusable="false"><use href="#{{ opcion.icono }}"/></svg><span class="menu-texto">{{ opcion.etiqueta }}</span>{% if opcion.corta %}<span class="menu-corta" aria-hidden="true">{{ opcion.corta }}</span>{% endif %}{% if opcion.otra_pestana %}<svg class="icono menu-externo" aria-hidden="true" focusable="false"><use href="#i-externo"/></svg><span class="sr-only"> (abre en otra pestaña)</span>{% endif %}</a>
