{% if page_obj.has_other_pages %}
<nav class="paginacion" aria-label="Paginación">
  {% if page_obj.has_previous %}
    <a href="{% querystring page=page_obj.previous_page_number %}">Página anterior</a>
  {% endif %}
  <span aria-current="page">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}">Página siguiente</a>
  {% endif %}
</nav>
{% endif %}
